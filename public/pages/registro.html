<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MentalPsique — Registro</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-page">

  <div class="login-visual">
    <div class="login-visual__brand">Mental<span>Psique</span></div>
    <blockquote class="login-visual__quote">
      "El primer paso hacia el cambio es la conciencia. El segundo paso es la aceptación."
    </blockquote>
    <p class="login-visual__author">— Nathaniel Branden</p>
  </div>

  <div class="login-form-side">
    <div class="login-box" style="max-width:480px">
      <h1 class="login-box__title">Crear cuenta</h1>
      <p class="login-box__sub">Completa el formulario para registrarte como paciente</p>

      <form id="form-registro" novalidate>
        <div class="form-grid form-grid--2" style="margin-bottom:1rem">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Tu apellido" required>
          </div>
        </div>
        <div class="form-grid" style="margin-bottom:1rem">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
          </div>
          <div class="form-group">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" id="password2" placeholder="Repite la contraseña" required>
          </div>
        </div>
        <span class="form-error" id="err-global" style="display:block;margin-bottom:.75rem"></span>
        <button type="submit" class="btn btn--primary" id="btn-submit" style="width:100%;justify-content:center;padding:.75rem">
          Registrarse
        </button>
      </form>

      <p class="login-register-link" style="margin-top:1.25rem">
        ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
      </p>
    </div>
  </div>

</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  document.getElementById('form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('btn-submit');
    const err   = document.getElementById('err-global');
    err.textContent = '';

    const nombre   = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2= document.getElementById('password2').value;

    if (!nombre || !apellido || !email || !password) { err.textContent = 'Todos los campos son obligatorios'; return; }
    if (password.length < 8) { err.textContent = 'La contraseña debe tener mínimo 8 caracteres'; return; }
    if (password !== password2) { err.textContent = 'Las contraseñas no coinciden'; return; }

    btn.disabled = true;
    btn.textContent = 'Registrando...';

    try {
      await API.registro({ nombre, apellido, email, password, rol: 'paciente' });
      Toast.success('Cuenta creada. Inicia sesión');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
      btn.textContent = 'Registrarse';
    }
  });
</script>
</body>
</html>
